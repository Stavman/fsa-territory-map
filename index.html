<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FSA Territory Map v4</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172033;overflow:hidden}
#sidebar{position:fixed;left:0;top:0;bottom:0;width:360px;padding:18px;overflow:auto;border-right:1px solid #dfe5ee;background:#fff;z-index:20}
#mapPane{position:fixed;left:360px;right:0;top:0;bottom:0;background:#e7edf3;overflow:hidden}
#map{position:absolute;inset:0;width:100%;height:100%;background:#e7edf3;z-index:2}
#version{position:absolute;right:12px;top:12px;z-index:10000;background:#172033;color:#fff;padding:5px 8px;border-radius:7px;font-size:12px;font-weight:700;pointer-events:none}
#mapMessage{position:absolute;left:18px;top:18px;z-index:10000;background:rgba(255,255,255,.95);border:1px solid #ccd5e2;padding:9px 11px;border-radius:9px;font-size:12px;max-width:380px;pointer-events:none}
h2{margin:0 0 4px}.muted{font-size:12px;color:#667085;line-height:1.35}.card{border:1px solid #dfe5ee;border-radius:12px;padding:12px;margin:12px 0}.row{display:flex;gap:8px;align-items:center}input[type=text],textarea{width:100%;padding:8px;border:1px solid #ccd5e2;border-radius:8px;font:inherit}textarea{min-height:76px}button{border:0;border-radius:8px;background:#2f64d6;color:#fff;padding:8px 11px;font-weight:650;cursor:pointer}.secondary{background:#edf2f8;color:#24324a}.danger{background:#fff0f0;color:#b42318}.small{font-size:12px;padding:5px 7px}.layer{display:grid;grid-template-columns:24px 1fr 24px 28px;gap:7px;align-items:center;padding:5px 0}.layer input[type=color]{width:22px;height:22px;border:0;padding:0}.checks label{display:flex;gap:7px;align-items:center;padding:4px 0;font-size:13px}.dot{width:10px;height:10px;border-radius:50%}#editor{display:none}
@media(max-width:760px){html,body{overflow:auto}#sidebar{position:relative;width:100%;height:46vh;border-right:0;border-bottom:1px solid #dfe5ee}#mapPane{position:relative;left:0;width:100%;height:54vh}}
</style>
</head>
<body>
<aside id="sidebar">
<h2>FSA Territory Map</h2><div class="muted">South Shore of Montréal and surrounding Québec.</div>
<div class="card"><strong>Find an FSA</strong><div class="row" style="margin-top:8px"><input id="search" maxlength="3" placeholder="J4K"><button id="find">Find</button></div><div id="status" class="muted" style="margin-top:8px">Starting interactive map…</div></div>
<div class="card"><div class="row" style="justify-content:space-between"><strong>Territory layers</strong><button id="addLayer" class="small">+ Layer</button></div><div id="layers"></div><div class="muted">One FSA can belong to several layers.</div></div>
<div id="editor" class="card"><div id="fsaTitle" style="font-size:20px;font-weight:800"></div><div class="muted" style="margin-top:7px">Assign to layers</div><div id="checks" class="checks"></div><div class="muted" style="margin:8px 0 5px">Notes</div><textarea id="note"></textarea><div class="row" style="margin-top:8px"><button id="save">Save</button><button id="clear" class="secondary">Clear</button></div></div>
<div class="card"><div class="row"><button id="export" class="secondary">Export JSON</button><button id="reset" class="danger">Reset</button></div></div>
</aside>
<section id="mapPane"><div id="map"></div><div id="mapMessage">Loading map and FSA boundaries…</div><div id="version">Build v4</div></section>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
(function(){
const statusEl=document.getElementById('status');
const msg=document.getElementById('mapMessage');
const STORE='fsa-territory-map-v4';
const SERVICE='https://geo.statcan.gc.ca/geo_wa/rest/services/2021/Cartographic_boundary_files/MapServer/14/query';
function uid(){return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
function defaults(){const id=uid();return{layers:[{id:id,name:'Territory 1',color:'#d64c4c',visible:true}],fsas:{J4G:{layers:[id],note:''},J4H:{layers:[id],note:''},J4K:{layers:[id],note:''},J4L:{layers:[id],note:''},J4N:{layers:[id],note:''}}}}
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE));return x&&x.layers&&x.fsas?x:defaults()}catch(e){return defaults()}}
let state=loadState(),selected=null,geoLayer=null,fsaLayers={},fsaFeatures={},overlap=null,map=null;
function saveState(){localStorage.setItem(STORE,JSON.stringify(state))}
function rec(c){if(!state.fsas[c])state.fsas[c]={layers:[],note:''};return state.fsas[c]}
function esc(s){return String(s).replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function memberships(c){return (state.fsas[c]&&state.fsas[c].layers?state.fsas[c].layers:[]).map(function(id){return state.layers.find(function(x){return x.id===id})}).filter(function(x){return x&&x.visible})}
function style(f){const c=f.properties.CFSAUID;const m=memberships(c);const p=m[0];return{color:p?p.color:'#64748b',weight:p?2.5:1,fillColor:p?p.color:'#ffffff',fillOpacity:p?0.20:0.02,opacity:0.9}}
function renderLayers(){const el=document.getElementById('layers');el.innerHTML='';state.layers.forEach(function(x){const d=document.createElement('div');d.className='layer';d.innerHTML='<input type="color" value="'+x.color+'"><input type="text" value="'+esc(x.name)+'"><input type="checkbox" '+(x.visible?'checked':'')+'><button class="small danger">×</button>';const color=d.children[0],name=d.children[1],vis=d.children[2],del=d.children[3];color.oninput=function(){x.color=color.value;saveState();refresh();renderEditor()};name.onchange=function(){x.name=name.value.trim()||'Untitled';saveState();renderEditor()};vis.onchange=function(){x.visible=vis.checked;saveState();refresh()};del.onclick=function(){if(state.layers.length===1){alert('Keep at least one layer.');return}state.layers=state.layers.filter(function(y){return y.id!==x.id});Object.values(state.fsas).forEach(function(r){r.layers=r.layers.filter(function(id){return id!==x.id})});saveState();renderLayers();renderEditor();refresh()};el.appendChild(d)})}
function renderEditor(){if(!selected)return;const r=rec(selected);const el=document.getElementById('checks');el.innerHTML='';state.layers.forEach(function(x){const lab=document.createElement('label');lab.innerHTML='<input type="checkbox" '+(r.layers.includes(x.id)?'checked':'')+'><span class="dot" style="background:'+x.color+'"></span><span>'+esc(x.name)+'</span>';const cb=lab.querySelector('input');cb.onchange=function(){if(cb.checked){if(!r.layers.includes(x.id))r.layers.push(x.id)}else{r.layers=r.layers.filter(function(id){return id!==x.id})}saveState();refresh()};el.appendChild(lab)});document.getElementById('note').value=r.note||''}
function refresh(){if(!map||!geoLayer)return;geoLayer.setStyle(style);overlap.clearLayers();Object.entries(fsaFeatures).forEach(function(entry){const c=entry[0],f=entry[1],m=memberships(c);if(m.length<2)return;m.slice(0,5).forEach(function(x,i){L.geoJSON(f,{renderer:L.canvas(),style:{color:x.color,weight:11-i*1.8,opacity:0.95,fillOpacity:0}}).addTo(overlap)});L.geoJSON(f,{renderer:L.canvas(),style:{color:'#fff',weight:1,fillOpacity:0}}).addTo(overlap)})}
function selectFsa(c,zoom){if(zoom===undefined)zoom=true;c=(c||'').toUpperCase();const layer=fsaLayers[c];if(!layer){statusEl.textContent=c+' was not found in the loaded FSA data.';return}selected=c;rec(c);document.getElementById('editor').style.display='block';document.getElementById('fsaTitle').textContent=c;renderEditor();if(zoom)map.fitBounds(layer.getBounds(),{padding:[30,30],maxZoom:13});statusEl.textContent='Selected '+c+'.'}
function bindControls(){document.getElementById('find').onclick=function(){const c=document.getElementById('search').value.trim().toUpperCase();if(!/^[A-Z]\d[A-Z]$/.test(c)){statusEl.textContent='Enter an FSA such as J4K.';return}selectFsa(c,true)};document.getElementById('search').onkeydown=function(e){if(e.key==='Enter')document.getElementById('find').click()};document.getElementById('search').oninput=function(e){e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3)};document.getElementById('addLayer').onclick=function(){const p=['#3478d4','#2f9d68','#8a5bd7','#e08a2d','#d64c4c','#158c98'];state.layers.push({id:uid(),name:'Territory '+(state.layers.length+1),color:p[state.layers.length%p.length],visible:true});saveState();renderLayers();renderEditor()};document.getElementById('save').onclick=function(){if(selected){rec(selected).note=document.getElementById('note').value;saveState();statusEl.textContent='Saved '+selected+'.'}};document.getElementById('clear').onclick=function(){if(selected){state.fsas[selected]={layers:[],note:''};saveState();renderEditor();refresh()}};document.getElementById('export').onclick=function(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fsa-territories.json';a.click()};document.getElementById('reset').onclick=function(){if(!confirm('Reset everything?'))return;state=defaults();selected=null;saveState();document.getElementById('editor').style.display='none';renderLayers();refresh()}}
async function start(){bindControls();renderLayers();if(typeof L==='undefined'){msg.textContent='Leaflet failed to load. Please refresh the page.';statusEl.textContent='Map library unavailable.';return}map=L.map('map',{preferCanvas:true,zoomControl:true,dragging:true,scrollWheelZoom:true}).setView([45.49,-73.43],10);overlap=L.layerGroup().addTo(map);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);setTimeout(function(){map.invalidateSize()},250);try{const p=new URLSearchParams({where:"PRUID='24'",outFields:'CFSAUID,PRUID',returnGeometry:'true',outSR:'4326',f:'geojson'});const r=await fetch(SERVICE+'?'+p.toString());if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();geoLayer=L.geoJSON(data,{renderer:L.canvas(),style:style,onEachFeature:function(f,l){const c=f.properties.CFSAUID;fsaFeatures[c]=f;fsaLayers[c]=l;l.bindTooltip(c,{sticky:true});l.on('click',function(){selectFsa(c,false)})}}).addTo(map);refresh();msg.style.display='none';statusEl.textContent='Ready — '+data.features.length+' Québec FSAs loaded.'}catch(e){console.error(e);msg.textContent='Street map works, but FSA boundaries could not load.';statusEl.textContent='Map ready; FSA boundaries unavailable.'}}
start();
})();
</script>
</body>
</html>
