<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>South Shore FSA Territory Map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<style>
*{box-sizing:border-box}html,body{height:100%;margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#172033}#app{height:100%;display:grid;grid-template-columns:360px minmax(0,1fr)}#sidebar{padding:18px;overflow:auto;border-right:1px solid #dfe5ee;background:white}#map{height:100vh;width:100%;background:#e8edf3;position:relative}.card{border:1px solid #dfe5ee;border-radius:12px;padding:12px;margin:12px 0}.row{display:flex;gap:8px}input[type=text],textarea{width:100%;padding:8px;border:1px solid #ccd5e2;border-radius:8px;font:inherit}button{border:0;border-radius:8px;background:#2f64d6;color:white;padding:8px 11px;font-weight:650;cursor:pointer}.secondary{background:#edf2f8;color:#24324a}.danger{background:#fff0f0;color:#b42318}.small{font-size:12px;padding:5px 7px}.muted{font-size:12px;color:#667085}.layer{display:grid;grid-template-columns:24px 1fr 24px 28px;gap:7px;align-items:center;padding:5px 0}.layer input[type=color]{width:22px;height:22px;border:0;padding:0}.checks label{display:flex;gap:7px;align-items:center;padding:4px 0;font-size:13px}.dot{width:10px;height:10px;border-radius:50%}#editor{display:none}#mapError{position:absolute;z-index:10000;top:20px;left:20px;right:20px;background:#fff3f2;border:1px solid #f0b4ae;border-radius:10px;padding:12px;color:#8a1c13;display:none}.leaflet-tooltip{font-weight:800}@media(max-width:760px){#app{grid-template-columns:1fr;grid-template-rows:46% 54%}#sidebar{border-right:0;border-bottom:1px solid #dfe5ee}#map{height:54vh}}
</style>
</head>
<body>
<div id="app">
<aside id="sidebar">
<h2 style="margin:0 0 4px">FSA Territory Map</h2>
<div class="muted">South Shore of Montréal and surrounding Québec.</div>
<div class="card"><strong>Find an FSA</strong><div class="row" style="margin-top:8px"><input id="search" maxlength="3" placeholder="J4K"><button id="find">Find</button></div><div id="status" class="muted" style="margin-top:8px">Starting map…</div></div>
<div class="card"><div class="row" style="justify-content:space-between;align-items:center"><strong>Territory layers</strong><button id="addLayer" class="small">+ Layer</button></div><div id="layers"></div><div class="muted">One FSA can belong to several layers at the same time.</div></div>
<div id="editor" class="card"><div id="fsaTitle" style="font-size:20px;font-weight:800"></div><div class="muted" style="margin-top:7px">Assign to layers</div><div id="checks" class="checks"></div><div class="muted" style="margin:8px 0 5px">Notes</div><textarea id="note"></textarea><div class="row" style="margin-top:8px"><button id="save">Save</button><button id="clear" class="secondary">Clear</button></div></div>
<div class="card"><div class="row"><button id="export" class="secondary">Export JSON</button><button id="reset" class="danger">Reset</button></div><div class="muted" style="margin-top:7px">Changes save automatically in this browser.</div></div>
</aside>
<main id="map"><div id="mapError"></div></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const errBox=document.getElementById('mapError');
function mapError(msg){errBox.textContent=msg;errBox.style.display='block';document.getElementById('status').textContent=msg}
if(typeof L==='undefined'){mapError('The map library did not load. Please try refreshing this page in Chrome or Safari.');throw new Error('Leaflet unavailable')}
const STORE='fsa-territory-map-v2';
const SERVICE='https://geo.statcan.gc.ca/geo_wa/rest/services/2021/Cartographic_boundary_files/MapServer/14/query';
const map=L.map('map',{preferCanvas:true}).setView([45.49,-73.43],10);
const tiles=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:18,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
tiles.on('tileerror',()=>mapError('The base map tiles are being blocked by the browser or network.'));
let state=loadState(),geoLayer=null,fsaLayers={},fsaFeatures={},selected=null,overlap=L.layerGroup().addTo(map);
function uid(){return crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).slice(2)+Date.now()}
function defaults(){const id=uid();return{layers:[{id,name:'Territory 1',color:'#d64c4c',visible:true}],fsas:{J4G:{layers:[id],note:''},J4H:{layers:[id],note:''},J4K:{layers:[id],note:''},J4L:{layers:[id],note:''},J4N:{layers:[id],note:''}}}}
function loadState(){try{const x=JSON.parse(localStorage.getItem(STORE));return x&&x.layers&&x.fsas?x:defaults()}catch(e){return defaults()}}
function saveState(){localStorage.setItem(STORE,JSON.stringify(state))}
function rec(c){if(!state.fsas[c])state.fsas[c]={layers:[],note:''};return state.fsas[c]}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function mem(c){return(state.fsas[c]?.layers||[]).map(id=>state.layers.find(x=>x.id===id)).filter(x=>x&&x.visible)}
function style(f){const c=f.properties.CFSAUID,m=mem(c),p=m[0];return{color:p?p.color:'#6c7889',weight:p?2.5:1,fillColor:p?p.color:'#fff',fillOpacity:p?.visible?.2??.02,opacity:.9}}
function renderLayers(){const el=document.getElementById('layers');el.innerHTML='';state.layers.forEach(x=>{const d=document.createElement('div');d.className='layer';d.innerHTML=`<input type="color" value="${x.color}"><input type="text" value="${esc(x.name)}"><input type="checkbox" ${x.visible?'checked':''}><button class="small danger">×</button>`;const[color,name,vis,del]=d.children;color.oninput=()=>{x.color=color.value;saveState();refresh();renderEditor()};name.onchange=()=>{x.name=name.value.trim()||'Untitled';saveState();renderEditor()};vis.onchange=()=>{x.visible=vis.checked;saveState();refresh()};del.onclick=()=>{if(state.layers.length===1)return alert('Keep at least one layer.');state.layers=state.layers.filter(y=>y.id!==x.id);Object.values(state.fsas).forEach(r=>r.layers=r.layers.filter(id=>id!==x.id));saveState();renderLayers();renderEditor();refresh()};el.appendChild(d)})}
function refresh(){if(geoLayer)geoLayer.setStyle(style);overlap.clearLayers();Object.entries(fsaFeatures).forEach(([c,f])=>{const m=mem(c);if(m.length<2)return;m.slice(0,5).forEach((x,i)=>L.geoJSON(f,{renderer:L.canvas(),style:{color:x.color,weight:11-i*1.8,opacity:.95,fillOpacity:0}}).addTo(overlap));L.geoJSON(f,{renderer:L.canvas(),style:{color:'#fff',weight:1,fillOpacity:0}}).addTo(overlap)})}
function selectFsa(c,zoom=true){c=(c||'').toUpperCase();const layer=fsaLayers[c];if(!layer){document.getElementById('status').textContent=c+' was not found.';return}selected=c;rec(c);document.getElementById('editor').style.display='block';document.getElementById('fsaTitle').textContent=c;renderEditor();if(zoom)map.fitBounds(layer.getBounds(),{padding:[30,30],maxZoom:13});document.getElementById('status').textContent='Selected '+c+'.'}
function renderEditor(){if(!selected)return;const r=rec(selected),el=document.getElementById('checks');el.innerHTML='';state.layers.forEach(x=>{const lab=document.createElement('label');lab.innerHTML=`<input type="checkbox" ${r.layers.includes(x.id)?'checked':''}><span class="dot" style="background:${x.color}"></span><span>${esc(x.name)}</span>`;const cb=lab.querySelector('input');cb.onchange=()=>{if(cb.checked){if(!r.layers.includes(x.id))r.layers.push(x.id)}else r.layers=r.layers.filter(id=>id!==x.id);saveState();refresh()};el.appendChild(lab)});document.getElementById('note').value=r.note||''}
async function loadBoundaries(){document.getElementById('status').textContent='Loading FSA boundaries…';try{const p=new URLSearchParams({where:"PRUID='24'",outFields:'CFSAUID,PRUID',returnGeometry:'true',outSR:'4326',f:'geojson'});const r=await fetch(SERVICE+'?'+p);if(!r.ok)throw new Error('HTTP '+r.status);const data=await r.json();geoLayer=L.geoJSON(data,{renderer:L.canvas(),style,onEachFeature:(f,l)=>{const c=f.properties.CFSAUID;fsaFeatures[c]=f;fsaLayers[c]=l;l.bindTooltip(c,{sticky:true});l.on('click',()=>selectFsa(c,false))}}).addTo(map);refresh();document.getElementById('status').textContent='Ready — '+data.features.length+' Québec FSAs loaded.'}catch(e){console.error(e);mapError('The base map loaded, but Statistics Canada FSA boundaries could not load.')}}
document.getElementById('find').onclick=()=>{const c=document.getElementById('search').value.trim().toUpperCase();if(!/^[A-Z]\d[A-Z]$/.test(c))return document.getElementById('status').textContent='Enter an FSA such as J4K.';selectFsa(c,true)};
document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')document.getElementById('find').click()};document.getElementById('search').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,3);
document.getElementById('addLayer').onclick=()=>{const p=['#3478d4','#2f9d68','#8a5bd7','#e08a2d','#d64c4c','#158c98'];state.layers.push({id:uid(),name:'Territory '+(state.layers.length+1),color:p[state.layers.length%p.length],visible:true});saveState();renderLayers();renderEditor()};
document.getElementById('save').onclick=()=>{if(selected){rec(selected).note=document.getElementById('note').value;saveState();document.getElementById('status').textContent='Saved '+selected+'.'}};document.getElementById('clear').onclick=()=>{if(selected){state.fsas[selected]={layers:[],note:''};saveState();renderEditor();refresh()}};
document.getElementById('export').onclick=()=>{const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='fsa-territories.json';a.click()};document.getElementById('reset').onclick=()=>{if(!confirm('Reset everything?'))return;state=defaults();selected=null;saveState();document.getElementById('editor').style.display='none';renderLayers();refresh()};
renderLayers();setTimeout(()=>map.invalidateSize(),250);loadBoundaries();
</script>
</body>
</html>
